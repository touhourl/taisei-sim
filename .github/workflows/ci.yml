name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: GNU/Linux x86_64
    runs-on: ubuntu-latest

    container:
      image: taiseiproject/linux-toolkit:20260804

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        run: make
