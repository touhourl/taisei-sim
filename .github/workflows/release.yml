name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: GNU/Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace taiseiproject/linux-toolkit:20260804 \
            sh -c 'git config --global --add safe.directory /workspace && make'

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf tmp dist
          mkdir -p tmp/res dist

          cp ./build/src/sim/libtaisei_sim.so tmp/
          cp ./build/resources/00-taisei.zip tmp/res/

          cd tmp
          zip -r "../dist/taisei-${GITHUB_REF_NAME}-gnu-linux-x86_64.zip" libtaisei_sim.so res/00-taisei.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/taisei-${GITHUB_REF_NAME}-gnu-linux-x86_64.zip" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"